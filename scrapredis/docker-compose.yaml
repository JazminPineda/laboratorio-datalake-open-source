services:
  scrapredis:
    image: redis:7-bookworm
    container_name: scrapredis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  default:
    external: true
    name: data-platform
