# Extra JARs (Iceberg runtime)
spark.jars                                      /opt/spark/user-jars/iceberg-spark-runtime-3.5_2.12-1.10.0.jar,/opt/spark/user-jars/iceberg-aws-bundle-1.10.1.jar

# Iceberg SQL extensions
spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Nessie Iceberg REST catalog (mirrors Trino iceberg.properties)
spark.sql.catalog.nessie                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.nessie.type                   rest
spark.sql.catalog.nessie.uri                    http://nessie:19120/iceberg
spark.sql.catalog.nessie.prefix                 main
spark.sql.catalog.nessie.s3.remote-signing-enabled  false
spark.sql.catalog.nessie.s3.endpoint            http://rustfs:9000
spark.sql.catalog.nessie.s3.path-style-access   true
spark.sql.catalog.nessie.s3.access-key-id       rustfsadmin
spark.sql.catalog.nessie.s3.secret-access-key   rustfsadmin
spark.sql.catalog.nessie.client.region          us-east-1

# S3/RustFS configuration (Spark writes data directly, same as Trino)
spark.hadoop.fs.s3a.endpoint                    http://rustfs:9000
spark.hadoop.fs.s3a.access.key                  rustfsadmin
spark.hadoop.fs.s3a.secret.key                  rustfsadmin
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3.impl                         org.apache.hadoop.fs.s3a.S3AFileSystem

# Event log (for History Server if added later)
spark.eventLog.enabled                          true
spark.eventLog.dir                              /opt/spark/spark-events
