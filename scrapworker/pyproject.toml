[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapworker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "scrapy>=2.14.1",
    "pyyaml>=6.0.3",
    "redis>=5.0.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
scrapworker = "scrapworker.cli:main"
